# Sea Sentinel: Production Parallel YOLO + U-Net Pipeline Configuration
# Dual-Path High-Recall Sonar Target Detection, Segmentation, Verification & Geospatial Platform

system:
  project_name: "Sea Sentinel Dual-Path AI Engine"
  version: "2.0.0"
  device: "auto" # "cuda", "cpu", or "auto"
  log_level: "INFO"

performance:
  target_latency_seconds: 20
  enable_gpu: true
  enable_fp16: true
  enable_onnx: true
  batch_size_yolo: 16
  batch_size_unet: 16
  async_audit_logging: true
  adaptive_tiling_threshold: 1100
  enable_coarse_screening: true

yolo:
  model_path: "backend/models/checkpoints/sih57_yolo_run/weights/best.pt"
  conf_threshold: 0.25 # High-recall threshold (avoids premature dropping of valid targets)
  iou_threshold: 0.45
  max_detections: 50
  img_size: 640

unet:
  checkpoint_path: "backend/models/checkpoints/unet/attention_unet_best.pt"
  model_type: "attention_unet" # "attention_unet" or "standard_unet"
  patch_size: 256
  stride: 192 # 75% step / 25% overlap
  confidence_threshold: 0.45 # Probability threshold for pixel mask
  min_component_area_px: 15 # Adaptive minimum area to retain tiny acoustic targets
  max_component_area_ratio: 0.40 # Suppress massive whole-image contrast step artifacts
  morphology:
    kernel_size: 3
    apply_opening: true
    apply_closing: true

tiling:
  enabled: true
  tile_size: 640
  overlap_ratio: 0.25 # 25% overlap between adjacent tiles
  min_image_dim_for_tiling: 900 # Only tile when image dimension exceeds this
  nms_iou_threshold: 0.40

fusion:
  iou_threshold: 0.25 # Bounding box IoU threshold for YOLO + U-Net association
  centroid_dist_ratio: 0.08 # Max normalized distance between centroids
  mask_in_box_threshold: 0.20 # Min fraction of mask within YOLO box (or vice versa)
  weights:
    yolo: 0.55
    unet: 0.45
  categories:
    both: "BOTH"
    yolo_only: "YOLO_ONLY"
    unet_only: "UNET_ONLY"

verification:
  enabled: true
  min_verification_score: 0.35
  weights:
    contrast: 0.25
    shadow_relief: 0.25
    morphology_compactness: 0.20
    model_confidence: 0.30
  autoencoder_checkpoint: "backend/models/checkpoints/autoencoder/baseline_autoencoder.pt"
  rock_cluster_eps: 70.0
  rock_cluster_min_samples: 4

multiframe:
  enabled: true
  max_frame_gap: 5
  spatial_distance_threshold_px: 80.0
  trajectory_weight: 0.60
  iou_weight: 0.40

geospatial:
  target_crs: "EPSG:4326"
  default_altitude_m: 12.0
  default_slant_range_m: 75.0
  strict_unreferenced_suppression: true # Strictly withhold synthetic GPS for Case C
